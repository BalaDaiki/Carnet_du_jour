<!DOCTYPE html>
<html lang="fr">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>

<style>
  :root{
    --bg:#122A25;
    --bg-deep:#0D211D;
    --card:#F3ECD9;
    --card-hi:#FFFBF0;
    --ink:#20241F;
    --ink-soft:#5C6459;
    --ink-faint:#8C9184;
    --line: rgba(32,36,31,0.14);
    --brass:#C0923F;
    --sage:#71926C;
    --clay:#BE6A4F;
    --indigo:#4C5C89;
    --olive:#8C9455;
    --sky:#4F84A0;
    --rose:#AD5F79;
    --plum:#7C5C8C;
    --teal:#3F8E82;
    --paper-shadow: 0 18px 40px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(120% 140% at 20% 0%, #17352E 0%, var(--bg-deep) 65%);
    font-family:'IBM Plex Sans', sans-serif;
    color: var(--card);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 0;
  }
  .frame{
    width:100%;
    max-width:440px;
    min-height:100vh;
    background: var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow: var(--paper-shadow);
    overflow:hidden;
  }
  .spine{ position:absolute; left:0; top:0; bottom:0; width:9px; background: rgba(255,255,255,0.06); z-index:5; }
  .spine-fill{ position:absolute; left:0; bottom:0; width:100%; background: linear-gradient(180deg, var(--brass), var(--sage)); transition: height .5s ease; }
  .content{ padding: 28px 22px 100px 30px; flex:1; }

  header.top{ margin-bottom: 22px; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color: var(--brass); margin:0 0 6px 0; }
  h1{ font-family:'Fraunces', serif; font-weight:500; font-size: 30px; line-height:1.1; margin:0 0 4px 0; color: var(--card-hi); }
  .subline{ font-size:13px; color: rgba(243,236,217,0.55); }
  .progress-line{ margin-top:16px; display:flex; align-items:center; gap:10px; }
  .progress-track{ flex:1; height:5px; border-radius:3px; background: rgba(255,255,255,0.08); overflow:hidden; }
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--brass), var(--sage)); border-radius:3px; transition: width .4s ease; }
  .progress-label{ font-family:'IBM Plex Mono', monospace; font-size:12px; color: rgba(243,236,217,0.65); white-space:nowrap; }

  .cards{ display:flex; flex-direction:column; gap:12px; margin-top:22px; }

  .card{ background: var(--card); border-radius: 14px; padding: 16px 16px 14px 18px; color: var(--ink); position:relative; cursor:pointer; border:1px solid rgba(0,0,0,0.04); transition: transform .15s ease; }
  .card:active{ transform: scale(0.98); }
  .tab{ position:absolute; left:-1px; top:14px; bottom:14px; width:4px; border-radius:3px; }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .card-title-row{ display:flex; align-items:center; gap:10px; }
  .icon{ width:20px; height:20px; flex-shrink:0; }
  .card-title{ font-family:'Fraunces', serif; font-weight:500; font-size:17px; }
  .check{ width:24px; height:24px; border-radius:50%; border:1.5px solid var(--ink-faint); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:13px; color:transparent; }
  .check.done{ background: var(--sage); border-color: var(--sage); color: var(--card-hi); }
  .card-status{ font-size:13px; color: var(--ink-soft); margin-top:6px; }
  .card-progress{ height:4px; border-radius:3px; background: rgba(32,36,31,0.09); margin-top:10px; overflow:hidden;}
  .card-progress-fill{ height:100%; border-radius:3px; }

  .add-card{ border:1.5px dashed rgba(243,236,217,0.3); border-radius:14px; padding:16px; text-align:center; color: rgba(243,236,217,0.65); font-size:14px; cursor:pointer; background:transparent; }
  .add-card:active{ transform: scale(0.98); }

  .overlay{ position:fixed; inset:0; background: rgba(13,33,29,0.55); opacity:0; pointer-events:none; transition: opacity .25s ease; z-index:20; display:flex; justify-content:center; }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{ width:100%; max-width:440px; background: var(--card-hi); position:absolute; left:50%; transform: translateX(-50%) translateY(100%); bottom:0; border-radius: 20px 20px 0 0; max-height:88vh; overflow-y:auto; transition: transform .3s cubic-bezier(.22,.9,.32,1); padding: 10px 22px 30px 22px; color: var(--ink); }
  .overlay.open .sheet{ transform: translateX(-50%) translateY(0); }
  .grabber{ width:38px; height:4px; background:var(--line); border-radius:3px; margin: 8px auto 14px; }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; gap:8px;}
  .sheet-title-input{ font-family:'Fraunces', serif; font-size:21px; font-weight:500; border:none; background:transparent; color:var(--ink); flex:1; padding:2px 0; }
  .sheet-title-input:focus{ outline:none; border-bottom:1px solid var(--brass); }
  .sheet-actions{ display:flex; align-items:center; gap:2px; }
  .icon-btn{ background:none; border:none; font-size:17px; color:var(--ink-soft); cursor:pointer; padding:6px;}
  .icon-btn.danger{ color: var(--clay); font-size:13px; font-family:'IBM Plex Sans',sans-serif; font-weight:600; white-space:nowrap; }
  .field-label{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color: var(--ink-faint); margin: 16px 0 6px; }
  input[type="text"], input[type="number"], textarea{ width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 11px; font-family:'IBM Plex Sans', sans-serif; font-size:14px; background: var(--card); color: var(--ink); outline:none; }
  textarea{ min-height:70px; resize:vertical; font-family:'IBM Plex Sans',sans-serif; }
  input:focus, textarea:focus{ border-color: var(--brass); }
  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }
  .row2 > button{ flex:1; }
  .row3{ display:flex; gap:8px; }
  .row3 > div{ flex:1; }
  .btn{ border:none; border-radius:10px; padding:11px 14px; font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; }
  .btn-primary{ background: var(--ink); color: var(--card-hi); }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border:1px solid var(--line); }
  .btn-full{ width:100%; margin-top:14px; }
  .exo-item{ border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; background: var(--card); }
  .exo-head{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .exo-name-input{ font-weight:600; border:none; background:transparent; padding:2px 0; font-size:15px;}
  .exo-name-input:focus{ background: var(--card-hi); border-radius:6px; }
  .mini-check{ width:22px;height:22px;border-radius:50%; border:1.5px solid var(--ink-faint); display:flex;align-items:center;justify-content:center; font-size:12px; flex-shrink:0; cursor:pointer;}
  .mini-check.done{ background:var(--sage); border-color:var(--sage); color:#fff; }
  .exo-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-top:10px; }
  .exo-grid label{ font-size:10px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; display:block; margin-bottom:3px; }
  .del-x{ background:none;border:none;color:var(--ink-faint); font-size:13px; cursor:pointer; }
  .add-link{ margin-top:12px; background:none; border:1px dashed var(--ink-faint); color:var(--ink-soft); width:100%; padding:10px; border-radius:10px; font-size:13px; cursor:pointer; font-family:'IBM Plex Sans',sans-serif;}
  .journal-entry{ border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .journal-date{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin-bottom:4px;}
  .journal-text{ font-size:13.5px; color:var(--ink-soft); white-space:pre-wrap; }
  .timer-box{ text-align:center; margin: 18px 0 6px; }
  .timer-display{ font-family:'IBM Plex Mono',monospace; font-size:44px; color:var(--ink); letter-spacing:.03em; }
  .timer-controls{ display:flex; gap:10px; justify-content:center; margin-top:14px; }
  .save-hint{ font-size:11px; color: var(--ink-faint); text-align:center; margin-top:14px; }

  .tabbar{ display:flex; gap:6px; margin-top:14px; background:var(--card); border-radius:10px; padding:4px; }
  .tab-btn{ flex:1; border:none; background:transparent; padding:8px 6px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; font-family:'IBM Plex Sans',sans-serif; }
  .tab-btn.active{ background: var(--ink); color: var(--card-hi); }

  .day-pills{ display:flex; gap:6px; margin-top:14px; overflow-x:auto; padding-bottom:2px; }
  .day-pill{ flex-shrink:0; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); border-radius:20px; padding:7px 12px; font-size:12px; font-weight:600; cursor:pointer; font-family:'IBM Plex Sans',sans-serif; position:relative; }
  .day-pill.active{ background:var(--ink); color:var(--card-hi); border-color:var(--ink); }
  .day-pill .dot{ position:absolute; top:3px; right:5px; width:5px; height:5px; border-radius:50%; background:var(--brass); }

  .rest-toggle{ display:flex; align-items:center; gap:8px; margin-top:14px; font-size:13px; color:var(--ink-soft); }
  .rest-toggle input{ width:auto; }

  .day-group-title{ font-family:'Fraunces', serif; font-size:15px; margin-top:20px; margin-bottom:4px; color:var(--ink); display:flex; align-items:center; gap:8px;}
  .day-group-title .muted{ font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; }

  .item-row{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .item-row input[type="text"]{ flex:1; }
  .add-row{ display:flex; gap:8px; margin-top:12px; }
  .add-row input{ flex:1; }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div class="frame">
  <div class="spine"><div class="spine-fill" id="spineFill" style="height:0%"></div></div>
  <div class="content">
    <header class="top">
      <p class="eyebrow" id="dateLabel">—</p>
      <h1>Carnet du jour</h1>
      <p class="subline" id="subLabel">Chargement…</p>
      <div class="progress-line">
        <div class="progress-track"><div class="progress-fill" id="dayProgressFill" style="width:0%"></div></div>
        <span class="progress-label" id="dayProgressLabel">0/0</span>
      </div>
      <button id="notifBtn" onclick="enableNotifications()" style="margin-top:14px;background:none;border:1px solid rgba(243,236,217,0.25);color:rgba(243,236,217,0.8);border-radius:20px;padding:7px 14px;font-size:12px;font-family:'IBM Plex Sans',sans-serif;cursor:pointer;">🔔 Activer les notifications</button>
    </header>
    <div class="cards" id="cardsList"></div>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="grabber"></div>
    <div id="sheetContent"></div>
  </div>
</div>

<script>
/* ---------------- ICONS ---------------- */
const ICONS = {
  gym: '<path d="M4 8v8M20 8v8M2 10v4M22 10v4M6 12h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  arabe: '<path d="M4 6h9M4 10h9M4 14h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15 14c2 1 5 1 5-2s-3-3-3-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>',
  coran: '<path d="M12 5c-1.8-1.3-4-2-6-2v14c2 0 4.2.7 6 2 1.8-1.3 4-2 6-2V3c-2 0-4.2.7-6 2z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/>',
  lecture: '<path d="M4 5.5c0-.5.5-1 1.2-1H11v14H5.2c-.7 0-1.2.5-1.2 1V5.5z" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M20 5.5c0-.5-.5-1-1.2-1H13v14h5.8c.7 0 1.2.5 1.2 1V5.5z" stroke="currentColor" stroke-width="1.6" fill="none"/>',
  ia: '<circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
  ecriture: '<path d="M4 20l1-4.2L15.5 5.3a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1L8.2 19 4 20z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>',
  skincare: '<path d="M12 3c3 4 6 7.5 6 11a6 6 0 1 1-12 0c0-3.5 3-7 6-11z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/>',
  custom: '<path d="M12 3l2.2 5.6L20 10l-4.6 3.8L16.6 20 12 16.6 7.4 20l1.2-6.2L4 10l5.8-1.4z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/>'
};
const CUSTOM_COLORS = ['var(--sage)','var(--olive)','var(--teal)','var(--brass)','var(--sky)','var(--clay)','var(--indigo)','var(--rose)','var(--plum)'];
const BUILTIN_IDS = ['gym','arabecoran','lecture','ia','ecriture','skincare'];

const DAY_KEYS = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const DAY_SHORT = {lundi:'Lun',mardi:'Mar',mercredi:'Mer',jeudi:'Jeu',vendredi:'Ven',samedi:'Sam',dimanche:'Dim'};
const DAY_FULL = {lundi:'Lundi',mardi:'Mardi',mercredi:'Mercredi',jeudi:'Jeudi',vendredi:'Vendredi',samedi:'Samedi',dimanche:'Dimanche'};

function todayKey(){
  const idx = new Date().getDay();
  const map=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  return map[idx];
}
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDateFR(){ const d=new Date(); return d.toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'}); }
function emptyWeek(){ const w={}; DAY_KEYS.forEach(k=>w[k]=[]); return w; }
function uid(){ return 'id'+Date.now()+Math.floor(Math.random()*1000); }

/* ---------------- DEFAULT PROGRAM ---------------- */
function gymExo(name, target){ return {id:uid(), name, target, poids:'', objectif:'', done:false}; }
function defaultGymDays(){
  return {
    lundi:{ label:'Pecs / Triceps', rest:false, ritualText:'4×10 tractions lestées', ritualDone:false, note:'', exercises:[
      gymExo('Développé couché','4×6-8'), gymExo('Développé incliné haltères','4×10'), gymExo('Dips lestés','3×8-10'),
      gymExo('Pecs fly','3×12-15'), gymExo('Barre au front','3×10'), gymExo('Extension corde','3×12')
    ]},
    mardi:{ label:'Dos / Biceps', rest:false, ritualText:'4×10 tractions lestées', ritualDone:false, note:'', exercises:[
      gymExo('Tirage horizontal','3×10'), gymExo('Tirage vertical','3×12'), gymExo('Curl barre','3×10'),
      gymExo('Curl incliné','3×12'), gymExo('Marteau','3×12')
    ]},
    mercredi:{ label:'Jambes', rest:false, ritualText:'4×10 tractions lestées', ritualDone:false, note:'', exercises:[
      gymExo('Squat','4×8'), gymExo('Presse','4×10'), gymExo('Soulevé de terre jambes tendues','3×10'),
      gymExo('Leg curl','3×12'), gymExo('Leg extension','3×12'), gymExo('Mollets','4×15-20')
    ]},
    jeudi:{ label:'Épaules / Abdos', rest:false, ritualText:'4×10 tractions lestées', ritualDone:false, note:'', exercises:[
      gymExo('Développé militaire','4×8'), gymExo('Élévations latérales','4×12-15'), gymExo('Oiseau','3×15'),
      gymExo('Face pull','3×15'), gymExo('Shrugs','3×12'), gymExo('Gainage','3×1 min'), gymExo('Relevés de jambes','3×15')
    ]},
    vendredi:{ label:'Haut du corps (rappel)', rest:false, ritualText:'4×10 tractions lestées', ritualDone:false, note:'', exercises:[
      gymExo('Développé incliné','3×10'), gymExo('Dips','3×12'), gymExo('Curl barre','3×10'),
      gymExo('Extension triceps','3×12'), gymExo('Élévations latérales','3×15')
    ]},
    samedi:{ label:'Repos', rest:true, ritualText:'', ritualDone:false, note:'Repos ou petite marche de 30-45 min.', exercises:[]},
    dimanche:{ label:'Repos', rest:true, ritualText:'', ritualDone:false, note:'Repos complet.', exercises:[]}
  };
}

function defaultState(){
  return {
    lastDate: todayStr(),
    order: ['gym','arabecoran','lecture','ia','ecriture','skincare'],
    categories: {
      gym: { type:'gym', title:'Salle', color:'var(--clay)', icon:'gym', days: defaultGymDays() },
      arabecoran: { type:'group', title:'Arabe & Coran', color:'var(--indigo)', icon:'arabe', subs:{
        arabe: { title:'Arabe', doneToday:false, progresLabel:'Leçon en cours', objectif:'Apprendre 10 mots par jour', notes:'' },
        coran: { title:'Coran', doneToday:false, unit:'pages', current:0, objectif:20, notes:'' }
      }},
      lecture: { type:'lecture', title:'Lecture', color:'var(--brass)', icon:'lecture', doneToday:false, titre:'', pagesLues:0, pagesTotal:0 },
      ia: { type:'ia', title:"3 min avec l'IA", color:'var(--sky)', icon:'ia', doneToday:false, sujet:'', dureeSec:180 },
      ecriture: { type:'ecriture', title:'Écriture', color:'var(--plum)', icon:'ecriture', entries:[] },
      skincare: { type:'week', title:'Skin care', color:'var(--rose)', icon:'skincare', days: emptyWeek() }
    }
  };
}

const STORAGE_KEY = 'carnet-du-jour-state-v1';
let state = null;

function updateDebugBadge(msg){
  const el = document.getElementById('debugBadge');
  if(el) el.textContent = msg;
}

async function loadState(){
  let raw = null;
  let source = 'défaut (rien trouvé)';
  const wsAvailable = (typeof window.storage !== 'undefined');
  let wsError = '';
  let lsError = '';

  if(wsAvailable){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){ raw = res.value; source = 'cloud (window.storage)'; }
    }catch(e){ wsError = (e && e.message) ? e.message : String(e); }
  }
  if(raw===null){
    try{
      const v = localStorage.getItem(STORAGE_KEY);
      if(v){ raw = v; source = 'local (localStorage)'; }
    }catch(e){ lsError = (e && e.message) ? e.message : String(e); }
  }

  try{ state = raw ? JSON.parse(raw) : defaultState(); }
  catch(e){ state = defaultState(); }
  migrateState();
  rolloverIfNewDay();
  render();

  updateDebugBadge(`chargé: ${source} · cloud dispo: ${wsAvailable?'oui':'non'}${wsError?(' (err: '+wsError+')'):''} · local: ${lsError?('err: '+lsError):'ok'}`);
}

async function saveState(){
  const raw = JSON.stringify(state);
  let lsOk = false, lsErr = '';
  try{ localStorage.setItem(STORAGE_KEY, raw); lsOk = true; }
  catch(e){ lsErr = (e && e.message) ? e.message : String(e); }

  let wsOk = null, wsErr = '';
  if(typeof window.storage !== 'undefined'){
    try{ await window.storage.set(STORAGE_KEY, raw, false); wsOk = true; }
    catch(e){ wsOk = false; wsErr = (e && e.message) ? e.message : String(e); }
  }
  const stamp = new Date().toLocaleTimeString('fr-FR');
  updateDebugBadge(`sauvegardé ${stamp} · local: ${lsOk?'ok':('err: '+lsErr)} · cloud: ${wsOk===null?'n/a':(wsOk?'ok':('err: '+wsErr))}`);
}
function migrateState(){
  if(!state.order) state.order = Object.keys(state.categories||{});
  if(!state.categories) state.categories = {};
  if(!state.seeds) state.seeds = {};
  if(!state.history) state.history = {};
  seedSkincareRoutine();
  seedComplements();
  removeArabe();
  removeArabeCoranCategory();
}

function removeArabeCoranCategory(){
  if(state.categories.arabecoran){
    delete state.categories.arabecoran;
    state.order = state.order.filter(x=>x!=='arabecoran');
    saveState();
  }
}

function removeArabe(){
  if(state.seeds.removeArabe) return;
  const cat = state.categories.arabecoran;
  if(cat && cat.subs && cat.subs.arabe){
    delete cat.subs.arabe;
    cat.title = 'Coran';
    cat.icon = 'coran';
  }
  state.seeds.removeArabe = true;
  saveState();
}

function seedSkincareRoutine(){
  if(state.seeds.skincareRoutine) return;
  if(!state.categories.skincare){
    state.categories.skincare = { type:'week', title:'Skin care', color:'var(--rose)', icon:'skincare', days: emptyWeek() };

function weekdayKeyForDateStr(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const idx = d.getDay();
  const map=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  return map[idx];
}
function buildDaySnapshot(dateStr){
  const ids = state.order.filter(id=>state.categories[id]);
  const cats = {};
  let doneCount = 0;
  ids.forEach(id=>{
    const st = statusFor(id, dateStr);
    cats[id] = { title: state.categories[id].title, color: state.categories[id].color, text: st.text, checked: st.checked };
    if(st.checked) doneCount++;
  });
  return { date: dateStr, doneCount, total: ids.length, pct: ids.length? Math.round(doneCount/ids.length*100):0, categories: cats };
}

function rolloverIfNewDay(){
  const t = todayStr();
  if(state.lastDate !== t){
    state.history[state.lastDate] = buildDaySnapshot(state.lastDate);
    Object.values(state.categories).forEach(cat=>{
      if(cat.type==='gym'){
        DAY_KEYS.forEach(dk=>{ const d=cat.days[dk]; d.ritualDone=false; d.exercises.forEach(e=>e.done=false); });
      } else if(cat.type==='group'){
        Object.values(cat.subs).forEach(s=> s.doneToday=false);
      } else if(cat.type==='week'){
        DAY_KEYS.forEach(dk=>{ (cat.days[dk]||[]).forEach(it=> it.done=false); });
      } else if('doneToday' in cat){
        cat.doneToday=false;
      }
    });
    state.lastDate = t;
    saveState();
  }
}

/* ---------------- STATUS / HOME ---------------- */
function statusFor(id, dateStr){
  dateStr = dateStr || todayStr();
  const dk = weekdayKeyForDateStr(dateStr);
  const cat = state.categories[id];
  switch(cat.type){
    case 'gym': {
      const day = cat.days[dk];
      if(day.rest) return {text:`${DAY_FULL[dk]} — jour de repos`, pct:100, checked:true};
      const items = [day.ritualDone, ...day.exercises.map(e=>e.done)];
      const done = items.filter(Boolean).length;
      return {text:`${DAY_FULL[dk]} — ${day.label} : ${done}/${items.length}`, pct: items.length?done/items.length*100:0, checked: items.length>0 && done===items.length};
    }
    case 'group': {
      const subs = Object.values(cat.subs);
      const done = subs.filter(s=>s.doneToday).length;
      return {text: subs.map(s=> s.title+(s.doneToday?' ✓':'')).join(' · '), pct: subs.length?done/subs.length*100:0, checked: done===subs.length};
    }
    case 'lecture': {
      const l = cat; const pct = l.pagesTotal? Math.min(100,l.pagesLues/l.pagesTotal*100):0;
      return {text: l.titre? `${l.titre} — ${l.pagesLues}/${l.pagesTotal||'?'} p.` : 'Aucun livre défini', pct, checked:l.doneToday};
    }
    case 'ia':
      return {text: cat.sujet? `Sujet : ${cat.sujet}` : 'Aucun sujet choisi', pct: cat.doneToday?100:0, checked: cat.doneToday};
    case 'ecriture': {
      const n = cat.entries.length; const has = cat.entries.some(e=>e.date===dateStr);
      return {text: `${n} entrée${n>1?'s':''} au total`, pct: has?100:0, checked: has};
    }
    case 'week': {
      const items = cat.days[dk]||[];
      const done = items.filter(i=>i.done).length;
      return {text: items.length? `${done}/${items.length} aujourd'hui` : 'Aucun élément défini', pct: items.length?done/items.length*100:0, checked: items.length>0 && done===items.length};
    }
  }
}

function render(){
  document.getElementById('dateLabel').textContent = fmtDateFR();
  const ids = state.order.filter(id=>state.categories[id]);
  const statuses = ids.map(id=>statusFor(id));
  const doneCount = statuses.filter(s=>s.checked).length;
  document.getElementById('subLabel').textContent = (ids.length && doneCount===ids.length) ? 'Journée complète. Bien joué.' : `${ids.length-doneCount} chose${ids.length-doneCount>1?'s':''} à faire aujourd'hui`;
  const pct = ids.length? doneCount/ids.length*100 : 0;
  document.getElementById('dayProgressFill').style.width = pct+'%';
  document.getElementById('dayProgressLabel').textContent = `${doneCount}/${ids.length}`;
  document.getElementById('spineFill').style.height = pct+'%';

  const list = document.getElementById('cardsList');
  list.innerHTML = '';
  ids.forEach((id,i)=>{
    const cat = state.categories[id]; const st = statuses[i];
    const card = document.createElement('div');
    card.className='card';
    card.onclick = ()=>openSheet(id);
    card.innerHTML = `
      <div class="tab" style="background:${cat.color}"></div>
      <div class="card-top">
        <div class="card-title-row">
          <svg class="icon" viewBox="0 0 24 24" style="color:${cat.color}">${ICONS[cat.icon]||ICONS.custom}</svg>
          <span class="card-title">${escapeHtml(cat.title)}</span>
        </div>
        <div class="check ${st.checked?'done':''}">${st.checked?'✓':''}</div>
      </div>
      <div class="card-status">${escapeHtml(st.text)}</div>
      <div class="card-progress"><div class="card-progress-fill" style="width:${st.pct}%; background:${cat.color}"></div></div>
    `;
    list.appendChild(card);

let deleteConfirmId = null;

  document.getElementById('overlay').classList.add('open');

function sheetHead(id, title){
  const delBtn = `<button class="icon-btn danger" onclick="deleteCategory('${id}')">${deleteConfirmId===id?'Confirmer ?':'Suppr.'}</button>`;
  return `<div class="sheet-head">
    <input class="sheet-title-input" type="text" value="${escapeAttr(title)}" onchange="renameCategory('${id}', this.value)">

function renameCategory(id, val){
  if(!val.trim()) return;
  state.categories[id].title = val.trim();
  saveState(); render();
}
function deleteCategory(id){
  if(deleteConfirmId!==id){ deleteConfirmId=id; openSheet(id); return; }
  delete state.categories[id];
  state.order = state.order.filter(x=>x!==id);
  deleteConfirmId=null;
  saveState(); closeSheet();
}

function sheetHTML(id){
  if(id==='newcat') return newCatSheet();
  if(id==='history') return historySheet();
  const cat = state.categories[id];
  if(!cat) return '';
  switch(cat.type){
    case 'gym': return gymSheet(id);
    case 'group': return groupSheet(id);
    case 'lecture': return lectureSheet(id);
    case 'ia': return iaSheet(id);
    case 'ecriture': return ecritureSheet(id);
    case 'week': return weekSheet(id);

}

function fmtTime(s){ const m=Math.floor(s/60), sec=s%60; return `${m}:${sec.toString().padStart(2,'0')}`; }
function startIaTimer(id){
  if(iaTimerInterval) return;
  let remaining = state.categories[id].dureeSec>0 ? state.categories[id].dureeSec : 180;
  const btn = document.getElementById('iaStartBtn'); if(btn) btn.disabled=true;
  iaTimerInterval = setInterval(()=>{
    remaining--;
    const disp = document.getElementById('iaTimerDisplay'); if(disp) disp.textContent = fmtTime(Math.max(0,remaining));
    if(remaining<=0){
      clearInterval(iaTimerInterval); iaTimerInterval=null;
      state.categories[id].doneToday = true; saveState(); openSheet(id); render();

  },1000);

function applyLanguageToolCorrections(text, matches){
  let result = text;
  const sorted = [...matches].sort((a,b)=> b.offset-a.offset);
  sorted.forEach(m=>{
    if(m.replacements && m.replacements.length){
      const rep = m.replacements[0].value;
      result = result.slice(0, m.offset) + rep + result.slice(m.offset + m.length);
    }
  });
  return result;
}
function correctEcriture(id){
  const ta = document.getElementById('ecritureInput');
  const statusEl = document.getElementById('ecritureCorrectStatus');
  const text = ta.value.trim();
  if(!text){ if(statusEl) statusEl.textContent = "Écris d'abord quelque chose."; return; }
  if(statusEl) statusEl.textContent = 'Vérification en cours…';
  fetch('https://api.languagetool.org/v2/check', {
    method: 'POST',
    headers: {'Content-Type':'application/x-www-form-urlencoded'},
    body: 'text=' + encodeURIComponent(text) + '&language=fr'
  })
  .then(r=>r.json())
  .then(data=>{
    const matches = data.matches || [];
    if(matches.length===0){
      if(statusEl) statusEl.textContent = "✓ Aucune faute trouvée.";
      return;
    }
    ta.value = applyLanguageToolCorrections(text, matches);
    if(statusEl) statusEl.textContent = `${matches.length} correction${matches.length>1?'s':''} appliquée${matches.length>1?'s':''} — relis avant d'enregistrer.`;
  })
  .catch(()=>{
    if(statusEl) statusEl.textContent = "Impossible de vérifier (pas de connexion ou service indisponible pour l'instant).";
  });
}
function addJournalEntry(id){
  const val = document.getElementById('ecritureInput').value.trim();
  if(!val) return;
  const t = todayStr();
  const cat = state.categories[id];
  const existing = cat.entries.find(e=>e.date===t);
  if(existing){ existing.text = val; } else { cat.entries.push({date:t, text:val}); }
  saveState(); openSheet(id); render();
}

/* ---------------- WEEK (skincare + custom) ---------------- */
let weekActiveDayMap = {};
function switchWeekDay(id, dk){ weekActiveDayMap[id]=dk; openSheet(id); }
function weekSheet(id){
  const cat = state.categories[id];
  if(!weekActiveDayMap[id]) weekActiveDayMap[id] = todayKey();
  const activeDay = weekActiveDayMap[id];
  const pills = DAY_KEYS.map(dk=>`<button class="day-pill ${activeDay===dk?'active':''}" onclick="switchWeekDay('${id}','${dk}')">${DAY_SHORT[dk]}${dk===todayKey()?'<span class=\"dot\"></span>':''}</button>`).join('');
  const items = cat.days[activeDay]||[];
  const rows = items.map(it=>`<div class="item-row">
      <div class="mini-check ${it.done?'done':''}" onclick="toggleWeekItem('${id}','${activeDay}','${it.id}')">${it.done?'✓':''}</div>
      <input type="text" value="${escapeAttr(it.text)}" onchange="updateWeekItem('${id}','${activeDay}','${it.id}',this.value)">
      <button class="del-x" onclick="delWeekItem('${id}','${activeDay}','${it.id}')">Suppr.</button>
    </div>`).join('');
  return sheetHead(id, cat.title) +
    `<div class="day-pills">${pills}</div>
    <div class="field-label">${DAY_FULL[activeDay]}</div>
    ${rows || '<p class="save-hint">Rien de prévu ce jour — ajoute un élément ci-dessous.</p>'}
    <div class="add-row">
      <input type="text" id="weekNewItem_${id}" placeholder="Ajouter un élément…">
      <button class="btn btn-primary" onclick="addWeekItem('${id}','${activeDay}')">Ajouter</button>
    </div>
    <p class="save-hint">Tout est enregistré automatiquement.</p>`;
}
function toggleWeekItem(id,dk,itemId){ const it=state.categories[id].days[dk].find(x=>x.id===itemId); it.done=!it.done; saveState(); openSheet(id); }
function updateWeekItem(id,dk,itemId,val){ const it=state.categories[id].days[dk].find(x=>x.id===itemId); it.text=val; saveState(); }
function delWeekItem(id,dk,itemId){ state.categories[id].days[dk] = state.categories[id].days[dk].filter(x=>x.id!==itemId); saveState(); openSheet(id); }
function addWeekItem(id,dk){
  const input = document.getElementById('weekNewItem_'+id);
  const val = (input.value||'').trim();
  if(!val) return;
  state.categories[id].days[dk].push({id:uid(), text:val, done:false});
  saveState(); openSheet(id);
}

/* ---------------- HISTORIQUE ---------------- */
let historyExpandedDate = null;
let historyActiveTab = 'jours';
function toggleHistoryDay(date){ historyExpandedDate = (historyExpandedDate===date) ? null : date; openSheet('history'); }
function switchHistoryTab(tab){ historyActiveTab=tab; openSheet('history'); }
function fmtDateFRFromStr(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'});
}
function fmtDateShortFR(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('fr-FR',{day:'numeric', month:'short'});
}
function computeStreak(){
  const dates = Object.keys(state.history||{}).sort();
  let streak = 0;
  for(let i=dates.length-1;i>=0;i--){
    const h = state.history[dates[i]];
    if(h.total>0 && h.doneCount===h.total){ streak++; } else break;
  }
  return streak;
}
function computeBestStreak(){
  const dates = Object.keys(state.history||{}).sort();
  let best=0, cur=0;
  dates.forEach(d=>{
    const h = state.history[d];
    if(h.total>0 && h.doneCount===h.total){ cur++; if(cur>best) best=cur; } else { cur=0; }
  });
  return best;
}
function computeAvg(n){
  const dates = Object.keys(state.history||{}).sort().reverse().slice(0,n);
  if(!dates.length) return 0;
  const sum = dates.reduce((s,d)=> s + (state.history[d].pct||0), 0);
  return Math.round(sum/dates.length);
}
function sparkline(){
  const dates = Object.keys(state.history||{}).sort().slice(-14);
  if(!dates.length) return '';
  const bars = dates.map(d=>{
    const h = state.history[d];
    const height = Math.max(4, Math.round(h.pct*0.34));
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:36px;gap:3px;">
      <div style="width:100%;max-width:10px;height:${height}px;background:${h.pct>=100?'var(--sage)':'var(--brass)'};border-radius:3px;"></div>
    </div>`;
  }).join('');
  return `<div style="display:flex;gap:4px;align-items:flex-end;margin-top:10px;">${bars}</div>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;margin-top:4px;">
      <span>${fmtDateShortFR(dates[0])}</span><span>aujourd'hui</span>
    </div>`;
}
function weekKeyForDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diffToMonday = (day===0 ? -6 : 1-day);
  const monday = new Date(d); monday.setDate(d.getDate()+diffToMonday);
  return monday.toISOString().slice(0,10);
}
function weeklyHistoryData(){
  const weeks = {};
  Object.keys(state.history||{}).sort().forEach(d=>{
    const wk = weekKeyForDate(d);
    if(!weeks[wk]) weeks[wk] = { monday: wk, days: [], catCounts: {} };
    weeks[wk].days.push(d);
    const h = state.history[d];
    Object.entries(h.categories).forEach(([id,c])=>{
      if(!weeks[wk].catCounts[id]) weeks[wk].catCounts[id] = { title:c.title, checked:0, total:0 };
      weeks[wk].catCounts[id].total++;
      if(c.checked) weeks[wk].catCounts[id].checked++;
    });
  });
  return weeks;
}
function historySheet(){
  const dates = Object.keys(state.history||{}).sort().reverse();
  const streak = computeStreak();
  const best = computeBestStreak();
  const avg7 = computeAvg(7);

  let statsBlock = '';
  if(dates.length){
    statsBlock = `
      <div class="row3" style="margin-top:16px;">
        <div style="text-align:center;background:var(--card);border-radius:10px;padding:10px 4px;">
          <div style="font-family:'Fraunces',serif;font-size:19px;">🔥 ${streak}</div>
          <div style="font-size:10px;color:var(--ink-faint);">série en cours</div>
        </div>
        <div style="text-align:center;background:var(--card);border-radius:10px;padding:10px 4px;">
          <div style="font-family:'Fraunces',serif;font-size:19px;">🏆 ${best}</div>
          <div style="font-size:10px;color:var(--ink-faint);">meilleure série</div>
        </div>
        <div style="text-align:center;background:var(--card);border-radius:10px;padding:10px 4px;">
          <div style="font-family:'Fraunces',serif;font-size:19px;">${avg7}%</div>
          <div style="font-size:10px;color:var(--ink-faint);">moy. 7 jours</div>
        </div>
      </div>
      ${sparkline()}
      <div class="tabbar" style="margin-top:16px;">
        <button class="tab-btn ${historyActiveTab==='jours'?'active':''}" onclick="switchHistoryTab('jours')">Jour par jour</button>
        <button class="tab-btn ${historyActiveTab==='semaines'?'active':''}" onclick="switchHistoryTab('semaines')">Par semaine</button>
      </div>`;
  }

  let body = '';
  if(dates.length===0){
    body = `<p class="save-hint" style="margin-top:20px">Rien pour l'instant — ton historique se remplira jour après jour, à partir de demain.</p>`;
  } else if(historyActiveTab==='jours'){
    body = dates.map(d=>{
      const h = state.history[d];
      const expanded = historyExpandedDate===d;
      const catRows = Object.values(h.categories).map(c=>`
        <div class="item-row" style="margin-top:6px;">
          <div class="mini-check ${c.checked?'done':''}" style="cursor:default;">${c.checked?'✓':''}</div>
          <span style="flex:1;font-size:13px;color:var(--ink-soft)"><b style="color:var(--ink)">${escapeHtml(c.title)}</b> — ${escapeHtml(c.text)}</span>
        </div>
      `).join('');
      return `
        <div class="exo-item" onclick="toggleHistoryDay('${d}')" style="cursor:pointer;">
          <div class="exo-head">
            <span style="font-family:'Fraunces',serif;font-size:15px;text-transform:capitalize;">${fmtDateFRFromStr(d)}</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint)">${h.doneCount}/${h.total}</span>
          </div>
          <div class="card-progress" style="margin-top:8px;"><div class="card-progress-fill" style="width:${h.pct}%; background:var(--sage)"></div></div>
          ${expanded? `<div style="margin-top:10px;">${catRows}</div>` : ''}
        </div>
      `;
    }).join('');
  } else {
    const weeks = weeklyHistoryData();
    const weekKeys = Object.keys(weeks).sort().reverse();
    body = weekKeys.map(wk=>{
      const w = weeks[wk];
      const monday = new Date(wk+'T00:00:00');
      const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
      const label = `${fmtDateShortFR(wk)} → ${sunday.toLocaleDateString('fr-FR',{day:'numeric', month:'short'})}`;
      const catRows = Object.values(w.catCounts).map(c=>`
        <div class="item-row" style="margin-top:6px;">
          <span style="flex:1;font-size:13px;color:var(--ink-soft)"><b style="color:var(--ink)">${escapeHtml(c.title)}</b></span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint)">${c.checked}/${c.total}</span>
        </div>
      `).join('');
      const totalDone = Object.values(w.catCounts).reduce((s,c)=>s+c.checked,0);
      const totalAll = Object.values(w.catCounts).reduce((s,c)=>s+c.total,0);
      const wpct = totalAll? Math.round(totalDone/totalAll*100) : 0;
      return `
        <div class="exo-item" onclick="toggleHistoryDay('w_${wk}')" style="cursor:pointer;">
          <div class="exo-head">
            <span style="font-family:'Fraunces',serif;font-size:15px;">Semaine du ${label}</span>
            <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint)">${wpct}%</span>
          </div>
          <div class="card-progress" style="margin-top:8px;"><div class="card-progress-fill" style="width:${wpct}%; background:var(--brass)"></div></div>
          ${historyExpandedDate===('w_'+wk) ? `<div style="margin-top:10px;">${catRows}</div>` : ''}
        </div>
      `;
    }).join('');
  }

  return `<div class="sheet-head"><span style="font-family:'Fraunces',serif;font-size:21px;font-weight:500;">Historique</span>
    <button class="icon-btn" onclick="closeSheet()">✕</button></div>
    ${statsBlock}
    <p class="save-hint" style="margin-top:14px;text-align:left;">Tape sur un ${historyActiveTab==='semaines'?'semaine':'jour'} pour voir le détail.</p>
    ${body}`;
}
function toggleSimple(id){ const cat=state.categories[id]; cat.doneToday=!cat.doneToday; saveState(); openSheet(id); render(); }
function updateField(id, field, val){ state.categories[id][field]=val; saveState(); render(); }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escapeAttr(s){ return (s||'').toString().replace(/"/g,'&quot;'); }

/* ---------------- NOTIFICATIONS ---------------- */
async function enableNotifications(){
  const btn = document.getElementById('notifBtn');
  if(window.ONESIGNAL_APP_ID === 'REMPLACE_PAR_TON_APP_ID'){
    if(btn) btn.textContent = '⚠️ App ID non configuré';
    return;
  }
  if(typeof window.OneSignalDeferred === 'undefined'){
    if(btn) btn.textContent = '⚠️ Service indisponible';
    return;
  }
  if(btn) btn.textContent = '…';
  window.OneSignalDeferred.push(async function(OneSignal){
    try{
      await OneSignal.Notifications.requestPermission();
      const granted = OneSignal.Notifications.permission;
      if(btn) btn.textContent = granted ? '🔔 Notifications activées' : '🔕 Refusées — réessaie depuis Réglages';
    }catch(e){
      if(btn) btn.textContent = '⚠️ Erreur';
      console.error('Erreur notifications', e);
    }
  });
}

loadState();
